<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Polla Copa América</title>
<style>
body { font-family: Arial; background: #f2f2f2; padding: 20px; }
.container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
.match { border-bottom: 1px solid #ddd; padding: 10px 0; }
.score { display: flex; gap: 10px; margin-top: 5px; }
input, button { width: 100%; padding: 8px; margin-top: 5px; }
button { background: #007bff; color: white; border: none; margin-top: 15px; cursor: pointer; }
button:hover { background: #0056b3; }
</style>
</head>
<body>

<div class="container">
<h2>Enviar Pronósticos</h2>

<form id="form">
  <input type="text" id="iniciales" placeholder="INICIALES EN MAYÚSCULA" required>

  <div class="match" data-partido="COL-BRA">
    <strong>Colombia vs Brasil</strong>
    <div class="score">
      <input type="number" class="golA" min="0" placeholder="Colombia">
      <input type="number" class="golB" min="0" placeholder="Brasil">
    </div>
  </div>

  <div class="match" data-partido="ARG-CHI">
    <strong>Argentina vs Chile</strong>
    <div class="score">
      <input type="number" class="golA" min="0" placeholder="Argentina">
      <input type="number" class="golB" min="0" placeholder="Chile">
    </div>
  </div>

  <div class="match" data-partido="JAP-CRO">
    <strong>Japón vs Croacia</strong>
    <div class="score">
      <input type="number" class="golA" min="0" placeholder="Japón">
      <input type="number" class="golB" min="0" placeholder="Croacia">
    </div>
  </div>

  <div class="match" data-partido="ALE-BEL">
    <strong>Alemania vs Bélgica</strong>
    <div class="score">
      <input type="number" class="golA" min="0" placeholder="Alemania">
      <input type="number" class="golB" min="0" placeholder="Bélgica">
    </div>
  </div>

  <button type="button" id="btnEnviar" onclick="enviarTodo()">ENVIAR PRONÓSTICOS</button>
</form>
</div>

<script>
<script>
async function enviarTodo() {
  const btn = document.getElementById('btnEnviar');
  const iniciales = document.getElementById('iniciales').value.trim();
  const url = "https://script.google.com/macros/s/AKfycbwTLNCmISo2KyauM7LUUbQciYPSCIAkYGdj0jRwg_dW1W-3fY5WfCGdqLScq28oor3i/exec"; // <--- reemplaza aquí

  if(!iniciales){
    alert("Pon tus iniciales");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Enviando...";

  // Recolectamos todos los partidos
  const partidosNode = document.querySelectorAll('.match');
  const partidos = [];

  partidosNode.forEach(p => {
    const partido = p.dataset.partido;
    const golesA = p.querySelector('.golA').value || 0;
    const golesB = p.querySelector('.golB').value || 0;
    partidos.push({ partido, golesA, golesB });
  });

  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ iniciales, partidos })
    });

    const text = await res.text();
    if(text === "OK"){
      alert("¡Pronósticos guardados en la hoja: " + iniciales.toUpperCase() + "!");
    } else {
      alert("Error al enviar: " + text);
    }

  } catch(err){
    console.error(err);
    alert("Error al enviar pronósticos: " + err.message);
  }

  btn.disabled = false;
  btn.innerText = "ENVIAR PRONÓSTICOS";
}
</script>

</body>
</html>
